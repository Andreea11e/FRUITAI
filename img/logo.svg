<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Emblema FruitAI (desen original): un fruct cu o orbită și o „vitamină” în jurul lui — exact ce face aplicația -->
  <defs>
    <linearGradient id="t" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D7FF5C"/><stop offset=".55" stop-color="#8EF0C9"/><stop offset="1" stop-color="#5BE3C4"/>
    </linearGradient>
    <linearGradient id="v" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC86B"/><stop offset="1" stop-color="#FF6FB5"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="17" fill="url(#t)"/>
  <!-- orbita, în spatele fructului -->
  <ellipse cx="32" cy="36" rx="25" ry="9" transform="rotate(-18 32 36)" fill="none" stroke="#0D0926" stroke-opacity=".28" stroke-width="2.4"/>
  <!-- fructul -->
  <path d="M32 21.5 C26.5 17.5 15.5 19.5 15.5 32.5 C15.5 43.5 22.5 51 28 51 C30 51 31 50.2 32 50.2 C33 50.2 34 51 36 51 C41.5 51 48.5 43.5 48.5 32.5 C48.5 19.5 37.5 17.5 32 21.5 Z" fill="#0D0926"/>
  <path d="M32 22 C32 18.5 33 15.8 35 13.8" stroke="#0D0926" stroke-width="2.8" stroke-linecap="round" fill="none"/>
  <path d="M35.5 16.5 C38.5 10 46 9.5 48.5 11.5 C46.5 17.5 40.5 19.5 35.5 16.5 Z" fill="#0D0926"/>
  <!-- lumina de pe fruct -->
  <path d="M21 30.5 C21.5 26.5 24 24.5 26.5 24.2" stroke="#8EF0C9" stroke-width="2.6" stroke-linecap="round" fill="none"/>
  <!-- partea din față a orbitei, peste fruct, cu „vitamina” -->
  <path d="M8.6 43.4 C17 47.6 36 44.2 50.5 34.6" transform="rotate(-18 32 36) translate(0 0)" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" opacity=".95"/>
  <circle cx="50.5" cy="26.6" r="5.2" fill="url(#v)" stroke="#FFFFFF" stroke-width="1.6"/>
</svg>
