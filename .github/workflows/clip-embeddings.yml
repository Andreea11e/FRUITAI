name: Vectori CLIP pentru catalog
# Când se schimbă catalogul sau formulările, recalculează data/clip-text.bin (o singură dată, aici, nu în browser)
# și testează recunoașterea pe fotografii reale de fructe.
on:
  push:
    branches: [main]
    paths:
      - data/fruits.json
      - data/non-fruits.json
      - data/clip-prompts.json
      - scripts/build-embeddings.mjs
      - .github/workflows/clip-embeddings.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: clip-embeddings, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/cache@v4
        with:
          path: ~/.cache/fruitai-hf
          key: hf-clip-b32-v1
      - name: Instalează transformers.js
        run: npm install --no-save --no-package-lock @huggingface/transformers@3.0.2
      - name: Calculează vectorii și testează pe fotografii reale
        run: HF_CACHE="$HOME/.cache/fruitai-hf" EVAL=1 node scripts/build-embeddings.mjs | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Salvează în proiect
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/clip-text.bin data/clip-text.json scripts/eval-report.txt
          git diff --cached --quiet || (git commit -m "Vectori CLIP recalculați automat" && git push)
